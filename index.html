<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket d'activation - Aperçu du design</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-custom-gradient {
            background: linear-gradient(135deg, rgba(76, 175, 80, 0.1), #FFFFFF, rgba(255, 193, 7, 0.2));
        }
        .file-upload-area {
            border: 2px dashed #FFC107;
            transition: all 0.3s ease;
        }
        .file-upload-area:hover {
            background-color: rgba(255, 249, 196, 0.3);
        }
    </style>
</head>
<body>
    <div class="min-h-screen flex items-center justify-center p-4 bg-custom-gradient">
        <div class="max-w-xl w-full mx-auto p-8 bg-white/80 backdrop-blur-sm rounded-2xl shadow-xl border border-[#FFC107]/30">
            <h2 class="text-3xl font-bold text-[#2E7D32] mb-2 text-center">🎫 Demande de ticket</h2>
            <p class="text-center text-gray-600 mb-6">Remplissez le formulaire et un code vous sera attribué</p>
            
            <!-- Formulaire -->
            <div class="mb-4">
                <label class="block text-sm font-medium text-[#2E7D32] mb-1">Nom complet *</label>
                <input class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#FFC107] focus:border-transparent" placeholder="Votre nom" />
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-[#2E7D32] mb-1">Email *</label>
                <input type="email" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#FFC107] focus:border-transparent" placeholder="votre@email.com" />
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-[#2E7D32] mb-1">Téléphone *</label>
                <input class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#FFC107] focus:border-transparent" placeholder="+229 00 00 00 00" />
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-[#2E7D32] mb-1">Message (optionnel)</label>
                <textarea rows="3" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#FFC107] focus:border-transparent" placeholder="Votre message..."></textarea>
            </div>
            
            <div class="mb-6">
                <label class="block text-sm font-medium text-[#2E7D32] mb-1">Importer une photo *</label>
                <div class="file-upload-area w-full p-4 rounded-lg text-center cursor-pointer">
                    <p class="text-gray-600">📁 Cliquez ou glissez une photo</p>
                    <p class="text-xs text-gray-400 mt-1">JPG, PNG, GIF (max 5MB)</p>
                </div>
            </div>
            
            <button class="w-full py-3 bg-[#2E7D32] text-white font-semibold rounded-lg hover:bg-[#4CAF50] transition disabled:opacity-50">
                📤 Envoyer
            </button>
            
            <div class="mt-4 p-3 rounded-lg bg-yellow-50 border border-yellow-200 text-yellow-800 text-sm">
                ⚡ <strong>Aperçu du design</strong> - Les fonctionnalités d'envoi seront actives après déploiement sur Vercel
            </div>

            <div class="mt-6 pt-4 border-t border-gray-200 text-center text-xs text-gray-500">
                🎨 Design : Blanc · Vert · Jaune | <span class="text-[#2E7D32]">✦</span> Ticket App
            </div>
        </div>
    </div>
</body>
</html>
